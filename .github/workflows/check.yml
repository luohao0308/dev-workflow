name: Checks

on:
  push:
  pull_request:

jobs:
  python-and-bash:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run checks
        run: bash scripts/check.sh

  powershell-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python workflow tools on Windows
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_workflow_config tests.test_release_prepare tests.test_release_execute tests.test_release_github tests.test_release_host tests.test_release_host_runner tests.test_release_offline tests.test_deployment_config tests.test_deployment_prepare tests.test_deployment_runtime tests.test_deployment_spec tests.test_deployment_execute tests.test_deployment_verify tests.test_deployment_verification tests.test_deployment_store tests.test_deployment_history tests.test_deployment_gateway tests.test_deployment_gateway_host tests.test_deployment_lookup tests.test_deployment_recover tests.test_deployment_recovery_host tests.test_deployment_operation tests.test_deployment_authorize tests.test_deployment_host tests.test_manage_skills tests.test_manifest_fixture tests.test_workflow_lock tests.test_upgrade_windows tests.test_deployment_host_config tests.test_deployment_host_doctor tests.test_deployment_host_doctor_tls tests.test_deployment_history_archive tests.test_deployment_maintenance tests.test_deployment_host_rotation
      - name: Run PowerShell integration tests
        shell: pwsh
        run: ./tests/integration.ps1
