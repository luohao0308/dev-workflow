name: Checks

on:
  push:
  pull_request:

jobs:
  python-and-bash:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run checks
        run: bash scripts/check.sh

  powershell-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python workflow tools on Windows
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_workflow_config tests.test_install_bytecode tests.test_release_prepare tests.test_release_execute tests.test_release_github tests.test_release_gitlab tests.test_release_gitlab_plan tests.test_release_gitlab_preflight_host tests.test_release_contract_v2 tests.test_provider_contract_v1 tests.test_release_host tests.test_release_host_runner tests.test_release_offline tests.test_deployment_config tests.test_deployment_prepare tests.test_deployment_compose_preflight tests.test_deployment_compose_engine_sample tests.test_deployment_compose_daemon_sample tests.test_deployment_compose_isolated_daemon_probe tests.test_deployment_compose_log_probe tests.test_compose_engine_sample_fixture tests.test_deployment_compose_batch tests.test_deployment_compose_observation tests.test_deployment_compose_reader tests.test_deployment_compose_reader_tls tests.test_deployment_compose_collect tests.test_deployment_compose_private tests.test_deployment_compose_config tests.test_deployment_compose_host_config tests.test_deployment_compose_network tests.test_deployment_compose_snapshot tests.test_deployment_compose_restore_config tests.test_deployment_compose_restore_host_config tests.test_deployment_compose_restore_body_host tests.test_deployment_compose_namespaced_restore_probe tests.test_compose_restore_probe_fixture tests.test_compose_restore_observer_fixture tests.test_deployment_compose_registry_enrollment_probe tests.test_deployment_compose_source_view_tls tests.test_deployment_compose_restore_network_audit tests.test_deployment_compose_network_declaration tests.test_deployment_compose_network_source_host tests.test_deployment_compose_image_reference tests.test_deployment_compose_create tests.test_deployment_compose_temporary tests.test_deployment_compose_create_inspect tests.test_deployment_compose_candidate_probe tests.test_deployment_compose_runtime_probe tests.test_deployment_compose_namespaced_runtime_probe tests.test_deployment_compose_namespaced_transition_probe tests.test_compose_runtime_probe_fixture tests.test_deployment_compose_image_defaults tests.test_deployment_compose_create_image_proof tests.test_deployment_compose_artifacts tests.test_deployment_compose_image_catalog tests.test_deployment_compose_recipe tests.test_deployment_compose_recipe_v3 tests.test_deployment_compose_baseline_recipe tests.test_deployment_compose_baseline_recipe_v3 tests.test_deployment_compose_target_artifacts tests.test_deployment_compose_target_v2 tests.test_deployment_compose_prepare_v2_host tests.test_deployment_compose_prepared_symbolic_plan tests.test_deployment_compose_protected_ids tests.test_deployment_compose_target_prepare tests.test_deployment_compose_operations tests.test_deployment_compose_followup tests.test_deployment_contract_v2 tests.test_deployment_compose_approval_host tests.test_deployment_compose_request_host tests.test_deployment_compose_proof_host tests.test_deployment_compose_recovery_host tests.test_deployment_compose_recovery_v3_host tests.test_deployment_compose_recovery_store tests.test_deployment_compose_receipts_host tests.test_deployment_compose_derived_receipts_host tests.test_deployment_compose_sourced_receipts_host tests.test_deployment_compose_generation_sources tests.test_deployment_gate_witness tests.test_deployment_compose_witness_store tests.test_deployment_compose_witness_ssh_probe tests.test_deployment_compose_observation_host tests.test_deployment_runtime tests.test_deployment_spec tests.test_deployment_execute tests.test_deployment_verify tests.test_deployment_verification tests.test_deployment_store tests.test_deployment_history tests.test_deployment_gateway tests.test_deployment_gateway_host tests.test_deployment_lookup tests.test_deployment_recover tests.test_deployment_recovery_host tests.test_deployment_operation tests.test_deployment_authorize tests.test_deployment_host tests.test_manage_skills tests.test_manifest_fixture tests.test_workflow_lock tests.test_upgrade_windows tests.test_deployment_host_config tests.test_deployment_host_doctor tests.test_deployment_host_doctor_tls tests.test_deployment_history_archive tests.test_deployment_maintenance tests.test_deployment_host_rotation tests.test_deployment_acceptance tests.test_deployment_acceptance_host
      - name: Full-body Compose contracts on Windows
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python -m unittest discover -s tests -p '*v3*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest tests.test_deployment_compose_full_body_review_contract
      - name: Run PowerShell integration tests
        shell: pwsh
        run: ./tests/integration.ps1
