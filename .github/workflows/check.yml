name: Checks

on:
  push:
  pull_request:

jobs:
  python-and-bash:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run checks
        run: bash scripts/check.sh

  powershell-integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python workflow tools on Windows
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_workflow_config tests.test_release_prepare tests.test_release_execute tests.test_release_github tests.test_release_host tests.test_release_host_runner tests.test_release_offline tests.test_deployment_config tests.test_deployment_prepare tests.test_manage_skills tests.test_manifest_fixture tests.test_workflow_lock tests.test_upgrade_windows
      - name: Run PowerShell integration tests
        shell: pwsh
        run: ./tests/integration.ps1
