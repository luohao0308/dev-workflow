name: P13 real deployment and rollback
on:
  workflow_dispatch:
    inputs:
      real_authority:
        description: Validate real GitHub approval and actual product execution
        required: true
        default: false
        type: boolean
      full_matrix:
        description: Run complete cross-platform validation
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: p13-isolated-validation-${{ inputs.real_authority }}
  cancel-in-progress: false
jobs:
  observer:
    if: inputs.real_authority
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: p13-observer
    permissions:
      contents: write
      actions: read
      deployments: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Start isolated runtime observer
        env:
          P1_GITHUB_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 - <<'PYTHON'
          import subprocess,sys,time
          from pathlib import Path
          log=open('p13-observer.log','wb')
          subprocess.Popen([sys.executable,'-I','-B','tests/support/p1_execution_live.py'],stdout=log,stderr=log,start_new_session=True)
          for _ in range(90):
              if Path('p13-results/failure.json').exists():
                  raise SystemExit(Path('p13-results/failure.json').read_text())
              if Path('p13-results/deployment-deploy-preview.json').exists():
                  break
              time.sleep(5)
          else:
              raise SystemExit('Runtime preview timeout')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p13-deploy-preview
          path: p13-results/deployment-deploy-preview.json
          retention-days: 7
      - name: Await deploy authorization and collect fresh rollback baseline
        run: |
          python3 - <<'PYTHON'
          import time
          from pathlib import Path
          for _ in range(450):
              if Path('p13-results/failure.json').exists():
                  raise SystemExit(Path('p13-results/failure.json').read_text())
              if Path('p13-results/deployment-rollback-preview.json').exists():
                  break
              time.sleep(5)
          else:
              raise SystemExit('Deploy review timeout')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p13-rollback-preview
          path: p13-results/deployment-rollback-preview.json
          retention-days: 7
      - name: Await independent rollback authorization
        run: |
          python3 - <<'PYTHON'
          import time
          from pathlib import Path
          for _ in range(450):
              if Path('p13-results/failure.json').exists():
                  raise SystemExit(Path('p13-results/failure.json').read_text())
              if Path('p13-results/summary.json').exists():
                  print(Path('p13-results/summary.json').read_text())
                  break
              time.sleep(5)
          else:
              raise SystemExit('Rollback review timeout')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p13-results
          path: |
            p13-results/
            p13-observer.log
          retention-days: 7
  deploy-review:
    if: inputs.real_authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: p13-deploy-approval
    steps:
      - run: echo 'Scoped real deployment review recorded'
  rollback-ready:
    if: inputs.real_authority
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
    steps:
      - name: Start rollback gate only after its fresh preview exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 260); do
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "p13-rollback-preview")] | length')
            if [ "$found" = 1 ]; then exit 0; fi
            sleep 10
          done
          exit 1
  rollback-review:
    if: inputs.real_authority
    needs: rollback-ready
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: p13-rollback-approval
    steps:
      - run: echo 'Scoped real rollback review recorded'
  docker-smoke:
    if: ${{ !inputs.real_authority }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Actual Docker deployment and rollback with explicit synthetic authority
        env:
          P13_MODE: smoke
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -B tests/support/p1_execution_live.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: p13-smoke-results
          path: p13-results/
          retention-days: 7
  python-and-bash:
    if: inputs.full_matrix
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run checks
        run: bash scripts/check.sh

  powershell-integration:
    if: inputs.full_matrix
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Python workflow tools on Windows
        shell: pwsh
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest tests.test_workflow_config tests.test_release_prepare tests.test_release_execute tests.test_release_github tests.test_release_host tests.test_release_host_runner tests.test_release_offline tests.test_deployment_config tests.test_deployment_prepare tests.test_deployment_runtime tests.test_deployment_spec tests.test_deployment_execute tests.test_deployment_authorize tests.test_deployment_host tests.test_manage_skills tests.test_manifest_fixture tests.test_workflow_lock tests.test_upgrade_windows
      - name: Run PowerShell integration tests
        shell: pwsh
        run: ./tests/integration.ps1
