{
  "services": {
    "backend": {
      "image": "${COMPOSE_SAMPLE_IMAGE:?immutable Python image required}",
      "command": [
        "python",
        "-u",
        "-c",
        "import http.server, json, os\nfrom pathlib import Path\nrole = os.environ['SAMPLE_ROLE']\nif role == 'backend':\n    sentinel = Path('/sample-data/sentinel.txt')\n    if not sentinel.exists():\n        sentinel.write_text('compose-engine-sample-sentinel-v1\\n')\nclass Handler(http.server.BaseHTTPRequestHandler):\n    def do_GET(self):\n        body = json.dumps({'role': role, 'version': 'v1', 'path': self.path}).encode()\n        self.send_response(200)\n        self.send_header('Content-Type', 'application/json')\n        self.send_header('Content-Length', str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\nhttp.server.HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()\n"
      ],
      "environment": {
        "SAMPLE_ROLE": "backend"
      },
      "read_only": true,
      "tmpfs": [
        "/tmp:size=4m"
      ],
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import json, os, urllib.request; response = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)); assert response == {'role': os.environ['SAMPLE_ROLE'], 'version': 'v1', 'path': '/health'}"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 15,
        "start_period": "2s"
      },
      "volumes": [
        {
          "type": "volume",
          "source": "sample-data",
          "target": "/sample-data",
          "read_only": false,
          "volume": {
            "nocopy": true
          }
        },
        {
          "type": "bind",
          "source": "${COMPOSE_SAMPLE_CONFIG_DIR:?precreated sample config directory required}",
          "target": "/sample-config",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ]
    },
    "frontend": {
      "image": "${COMPOSE_SAMPLE_IMAGE:?immutable Python image required}",
      "command": [
        "python",
        "-u",
        "-c",
        "import http.server, json, os\nfrom pathlib import Path\nrole = os.environ['SAMPLE_ROLE']\nif role == 'backend':\n    sentinel = Path('/sample-data/sentinel.txt')\n    if not sentinel.exists():\n        sentinel.write_text('compose-engine-sample-sentinel-v1\\n')\nclass Handler(http.server.BaseHTTPRequestHandler):\n    def do_GET(self):\n        body = json.dumps({'role': role, 'version': 'v1', 'path': self.path}).encode()\n        self.send_response(200)\n        self.send_header('Content-Type', 'application/json')\n        self.send_header('Content-Length', str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\nhttp.server.HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()\n"
      ],
      "environment": {
        "SAMPLE_ROLE": "frontend"
      },
      "read_only": true,
      "tmpfs": [
        "/tmp:size=4m"
      ],
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import json, os, urllib.request; response = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)); assert response == {'role': os.environ['SAMPLE_ROLE'], 'version': 'v1', 'path': '/health'}"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 15,
        "start_period": "2s"
      },
      "volumes": [
        {
          "type": "volume",
          "source": "sample-data",
          "target": "/sample-data",
          "read_only": true,
          "volume": {
            "nocopy": true
          }
        },
        {
          "type": "bind",
          "source": "${COMPOSE_SAMPLE_CONFIG_DIR:?precreated sample config directory required}",
          "target": "/sample-config",
          "read_only": true,
          "bind": {
            "create_host_path": false
          }
        }
      ],
      "depends_on": {
        "backend": {
          "condition": "service_healthy"
        }
      }
    },
    "guard": {
      "image": "${COMPOSE_SAMPLE_IMAGE:?immutable Python image required}",
      "command": [
        "python",
        "-u",
        "-c",
        "import http.server, json, os\nfrom pathlib import Path\nrole = os.environ['SAMPLE_ROLE']\nif role == 'backend':\n    sentinel = Path('/sample-data/sentinel.txt')\n    if not sentinel.exists():\n        sentinel.write_text('compose-engine-sample-sentinel-v1\\n')\nclass Handler(http.server.BaseHTTPRequestHandler):\n    def do_GET(self):\n        body = json.dumps({'role': role, 'version': 'v1', 'path': self.path}).encode()\n        self.send_response(200)\n        self.send_header('Content-Type', 'application/json')\n        self.send_header('Content-Length', str(len(body)))\n        self.end_headers()\n        self.wfile.write(body)\nhttp.server.HTTPServer(('0.0.0.0', 8080), Handler).serve_forever()\n"
      ],
      "environment": {
        "SAMPLE_ROLE": "guard"
      },
      "read_only": true,
      "tmpfs": [
        "/tmp:size=4m"
      ],
      "restart": "unless-stopped",
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "10m",
          "max-file": "3"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import json, os, urllib.request; response = json.load(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)); assert response == {'role': os.environ['SAMPLE_ROLE'], 'version': 'v1', 'path': '/health'}"
        ],
        "interval": "2s",
        "timeout": "3s",
        "retries": 15,
        "start_period": "2s"
      }
    }
  },
  "volumes": {
    "sample-data": {}
  }
}
