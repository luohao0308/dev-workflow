      "environment": {
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "healthcheck": {
        "timeout": "20s",
        "interval": "10s",
        "start_period": "20s",
        "retries": 8
      }
    },
    "guard": {
      "mem_limit": "64m",
      "memswap_limit": "64m",
      "cpus": 0.1,
      "pids_limit": 32,
      "environment": {
        "PYTHONDONTWRITEBYTECODE": "1"
      },
      "healthcheck": {
        "timeout": "20s",
        "interval": "10s",
        "start_period": "20s",
        "retries": 8
      }
    }
  }
